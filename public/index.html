<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Multiplayer Web Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Nút tương tác khi lại gần trung tâm */
        #action-btn {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: #00b894;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }
        #action-btn:hover { background-color: #55efc4; color: #111; }
    </style>

    <!-- Thư viện Three.js và Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <button id="action-btn" onclick="performTask()">💻 Làm nhiệm vụ</button>

    <script>
        // --- 1. KẾT NỐI SOCKET.IO MULTIPLAYER ---
        // Khi test trên máy tính giữ 'http://localhost:3000', khi đưa lên mạng thay bằng link Render của bạn
        const SOCKET_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://threed-multiplayer-game-w08h.onrender.com';
        const socket = io(SOCKET_URL);
        const otherPlayers = {};

        // --- 2. KHỞI TẠO 3D SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d3436);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Ánh sáng
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        const colliders = [];
        const baseFloor = new THREE.Mesh(
            new THREE.BoxGeometry(40, 0.2, 40),
            new THREE.MeshStandardMaterial({ color: 0x353b48 })
        );
        baseFloor.position.y = -0.1;
        scene.add(baseFloor);
        colliders.push(baseFloor);

        // --- 3. HÀM TẠO NHÂN VẬT STICKMAN ---
        function createStickmanMesh(colorHex) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2 });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mat);
            head.position.y = 1.4;
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 8), mat);
            body.position.y = 0.9;
            group.add(body);

            const legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 8);
            legGeo.translate(0, -0.3, 0);
            
            const leftLeg = new THREE.Mesh(legGeo, mat);
            leftLeg.position.set(-0.12, 0.6, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, mat);
            rightLeg.position.set(0.12, 0.6, 0);
            group.add(rightLeg);

            const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8);
            armGeo.translate(0, -0.25, 0);

            const leftArm = new THREE.Mesh(armGeo, mat);
            leftArm.position.set(-0.2, 1.1, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, mat);
            rightArm.position.set(0.2, 1.1, 0);
            group.add(rightArm);

            return group;
        }

        // Tạo nhân vật của chính mình (Màu xanh ngọc)
        const playerGroup = createStickmanMesh(0x00f5d4);
        playerGroup.position.set(0, 0, 8);
        scene.add(playerGroup);

        // Lấy danh sách các bộ phận chân/tay để làm hiệu ứng bước đi
        const leftLeg = playerGroup.children[2];
        const rightLeg = playerGroup.children[3];
        const leftArm = playerGroup.children[4];
        const rightArm = playerGroup.children[5];

        // --- 4. LOAD FILE STL ---
        const loader = new THREE.STLLoader();
        const fileName = 'smallhome.stl'; // Đảm bảo file STL để trong thư mục public
        const taskPoint = new THREE.Vector3(0, 0, 0);

        loader.load(fileName, (geometry) => {
            geometry.center();
            geometry.computeBoundingBox();

            const box = geometry.boundingBox;
            const maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
            const scaleFactor = maxDim > 0 ? (16 / maxDim) : 1;

            const material = new THREE.MeshStandardMaterial({ 
                color: 0x74b9ff, 
                roughness: 0.4,
                side: THREE.DoubleSide 
            });
            const stlMesh = new THREE.Mesh(geometry, material);

            stlMesh.rotation.x = -Math.PI / 2;
            stlMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
            stlMesh.position.y = (box.max.z - box.min.z) * scaleFactor / 2;

            scene.add(stlMesh);
            colliders.push(stlMesh);
        }, undefined, (error) => {
            console.error("Không tìm thấy file STL, đang dùng sàn mẫu.");
        });

        // --- 5. LẮNG NGHE SỰ KIỆN SOCKET MULTIPLAYER ---
        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (id === socket.id) return;
                createOtherPlayer(id, serverPlayers[id]);
            });
        });

        socket.on('newPlayer', (data) => {
            createOtherPlayer(data.id, data.player);
        });

        socket.on('playerMoved', (data) => {
            if (otherPlayers[data.id]) {
                otherPlayers[data.id].position.set(data.player.x, data.player.y, data.player.z);
                otherPlayers[data.id].rotation.y = data.player.rotY;
            }
        });

        socket.on('disconnectPlayer', (id) => {
            if (otherPlayers[id]) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        });

        function createOtherPlayer(id, playerInfo) {
            // Người chơi khác hiển thị màu đỏ để phân biệt
            const otherGroup = createStickmanMesh(0xff4757);
            otherGroup.position.set(playerInfo.x, playerInfo.y, playerInfo.z);
            scene.add(otherGroup);
            otherPlayers[id] = otherGroup;
        }

        // --- 6. ĐIỀU KHIỂN BÀN PHÍM & GAME LOOP ---
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        const raycaster = new THREE.Raycaster();
        const speed = 0.08;
        let walkTimer = 0;
        const actionBtn = document.getElementById('action-btn');

        function animate() {
            requestAnimationFrame(animate);

            let inputX = 0, inputZ = 0;
            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            if (inputX !== 0 || inputZ !== 0) {
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                cameraDirection.y = 0;
                cameraDirection.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraDirection, new THREE.Vector3(0, 1, 0));

                let moveDir = new THREE.Vector3();
                moveDir.addScaledVector(cameraDirection, -inputZ);
                moveDir.addScaledVector(cameraRight, inputX);
                moveDir.normalize();

                const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, targetAngle, 0.2);

                let canMove = true;
                if (colliders.length > 1) {
                    const rayOrigin = playerGroup.position.clone();
                    rayOrigin.y += 0.8;
                    raycaster.set(rayOrigin, moveDir);
                    const hits = raycaster.intersectObjects(colliders, true);

                    if (hits.length > 0 && hits[0].distance < 0.5) {
                        canMove = false;
                    }
                }

                if (canMove) {
                    playerGroup.position.x += moveDir.x * speed;
                    playerGroup.position.z += moveDir.z * speed;
                }

                // Hiệu ứng bước đi
                walkTimer += 0.15;
                leftLeg.rotation.x = Math.sin(walkTimer) * 0.6;
                rightLeg.rotation.x = -Math.sin(walkTimer) * 0.6;
                leftArm.rotation.x = -Math.sin(walkTimer) * 0.5;
                rightArm.rotation.x = Math.sin(walkTimer) * 0.5;

                // Gửi tọa độ thời gian thực lên Server Multiplayer
                socket.emit('playerMovement', {
                    x: playerGroup.position.x,
                    y: playerGroup.position.y,
                    z: playerGroup.position.z,
                    rotY: playerGroup.rotation.y
                });
            } else {
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.1);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.1);
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.1);
                rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.1);
            }

            // Kiểm tra khoảng cách hiển thị nút tương tác
            const distanceToTask = playerGroup.position.distanceTo(taskPoint);
            if (distanceToTask < 2.5) {
                actionBtn.style.display = 'block';
            } else {
                actionBtn.style.display = 'none';
            }

            controls.target.copy(playerGroup.position);
            controls.update();
            renderer.render(scene, camera);
        }

        function performTask() {
            alert("🎉 Bạn đã tương tác thành công!");
        }

        animate();
    </script>
</body>
</html>
